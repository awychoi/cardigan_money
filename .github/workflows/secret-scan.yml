name: secret-scan

on:
  push:
  pull_request:
  schedule:
    # Weekly re-scan: catches credentials that became public later, and rules
    # added by newer gitleaks releases.
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    env:
      # Pinned. When bumping, verify the sha256 against the release asset:
      # https://github.com/gitleaks/gitleaks/releases
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_LINUX_X64_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o /tmp/gitleaks.tar.gz "$url"
          echo "${GITLEAKS_LINUX_X64_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full commit history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --no-banner .

      # Gitleaks does not know this app's file extensions, so a committed
      # vault, backup, or plaintext ledger export would pass the secret scan.
      # These artifacts must never be tracked; .gitignore is the prevention
      # layer and this step is the detection layer.
      - name: Reject tracked vault, backup, and ledger-export artifacts
        run: |
          set -euo pipefail
          matches="$(git ls-files | grep -nE \
            '\.cmdb(-wal|-shm|-journal)?$|\.cmdb\.restore-old$|\.cmbak$|vault\.header(\.bak)?$|cardigan-money-ledger-.*\.csv$|\.cm-export-.*\.tmp$' || true)"
          if [ -n "$matches" ]; then
            echo "::error::A vault, backup, or plaintext ledger export is tracked. Run 'git rm --cached <file>' and rotate the affected passphrase or Plaid credentials if it was pushed."
            echo "$matches"
            exit 1
          fi
          echo "No vault, backup, or ledger-export artifacts are tracked."
