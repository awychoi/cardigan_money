# cargo-deny policy for cardigan_money.
# Run: cargo deny check

[graph]
# The shipped artifact is Apple Silicon macOS. Linux/Windows dependencies in
# Tauri's graph are not compiled for this product; excluding them from this
# check also avoids false license/advisory noise from unused platform crates.
targets = [{ triple = "aarch64-apple-darwin" }]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "Unlicense",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "PolyForm-Noncommercial-1.0.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
