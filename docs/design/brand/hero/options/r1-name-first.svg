  <circle cx="286" cy="326.5" r="3" fill="#7fc2b0" opacity=".8"/><text x="298" y="330" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="500" letter-spacing=".4" fill="#97a2b1">No account</text>
  <circle cx="424" cy="326.5" r="3" fill="#7fc2b0" opacity=".8"/><text x="436" y="330" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5" font-weight="500" letter-spacing=".4" fill="#97a2b1">No telemetry</text>

