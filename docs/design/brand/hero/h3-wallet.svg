<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="cardigan_money hero header — Wallet">
  <defs>
    <linearGradient id="w-paper" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#f8f3e9"/>
      <stop offset="0.6" stop-color="#f3ede1"/>
      <stop offset="1" stop-color="#ece4d4"/>
    </linearGradient>
    <linearGradient id="w-panel" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2f6d5f"/>
      <stop offset="0.55" stop-color="#22564b"/>
      <stop offset="1" stop-color="#153d35"/>
    </linearGradient>
    <linearGradient id="w-pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a4a3f"/>
      <stop offset="1" stop-color="#0c2a24"/>
    </linearGradient>
    <linearGradient id="w-graphite" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a424b"/>
      <stop offset="1" stop-color="#171c22"/>
    </linearGradient>
    <linearGradient id="w-navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27455f"/>
      <stop offset="0.6" stop-color="#162c40"/>
      <stop offset="1" stop-color="#0b1721"/>
    </linearGradient>
    <linearGradient id="w-rust" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c98360"/>
      <stop offset="1" stop-color="#8c4a31"/>
    </linearGradient>
    <linearGradient id="w-cream" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#eee6d5"/>
    </linearGradient>
    <linearGradient id="w-chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e2c087"/>
      <stop offset="1" stop-color="#ab7f45"/>
    </linearGradient>
    <filter id="w-panelshadow" x="-15%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="-18" dy="20" stdDeviation="28" flood-color="#3c2e1e" flood-opacity="0.28"/>
    </filter>
    <filter id="w-cardshadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#071d18" flood-opacity="0.35"/>
    </filter>
    <clipPath id="w-panelclip">
      <path d="M 1044 0 H 1600 V 560 H 1044 Q 1000 560 1000 516 V 44 Q 1000 0 1044 0 Z"/>
    </clipPath>
    <clipPath id="w-minitile">
      <rect width="52" height="52" rx="12"/>
    </clipPath>
    <clipPath id="w-pocketclip">
      <path d="M 990 424 Q 1300 468 1610 424 L 1610 570 L 990 570 Z"/>
    </clipPath>
  </defs>

  <rect width="1600" height="560" fill="url(#w-paper)"/>

  <!-- left copy -->
  <g transform="translate(88 52)">
    <g clip-path="url(#w-minitile)">
      <rect width="52" height="52" fill="url(#w-panel)"/>
      <circle cx="12" cy="10" r="22" fill="#ffffff" opacity="0.07"/>
      <g transform="rotate(-7 26 25)">
        <rect x="12" y="8" width="30" height="27" rx="3.5" fill="url(#w-cream)" filter="url(#w-cardshadow)"/>
        <rect x="12" y="8" width="30" height="6" rx="2" fill="#b26a4c"/>
        <rect x="16" y="19" width="6" height="4.5" rx="1" fill="#c8a163"/>
        <path d="M 20 26 H 38" stroke="#b26a4c" stroke-width="2.4" stroke-linecap="round"/>
      </g>
      <path d="M 3 33 Q 26 40 49 33 L 49 53 L 3 53 Z" fill="#1b4b41"/>
      <g stroke="#f7f3e8" stroke-width="1.6" stroke-linecap="round" opacity="0.18">
        <path d="M 8 36 V 53 M 14 37 V 53 M 20 38 V 53 M 26 38.5 V 53 M 32 38 V 53 M 38 37 V 53 M 44 36 V 53"/>
      </g>
      <path d="M 4 34 Q 26 41 48 34" fill="none" stroke="#f7f3e8" stroke-width="1.2" stroke-dasharray="1 3" opacity="0.6"/>
    </g>
  </g>
  <text x="156" y="88" font-family="'New York', 'Iowan Old Style', Georgia, serif" font-size="36" font-weight="500" letter-spacing="-1.2" fill="#161d26">Cardigan <tspan font-style="italic" fill="#2c6659">money</tspan></text>
  <text x="158" y="113" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.8" font-weight="500" letter-spacing="2.2" fill="#6f766f">LOCAL-FIRST LEDGER FOR MACOS</text>

  <text x="88" y="188" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="2.4" fill="#2c6659">TACTILE CARDS, QUIET NUMBERS</text>
  <text x="86" y="280" font-family="'New York', 'Iowan Old Style', Georgia, serif" font-size="71" font-weight="500" letter-spacing="-3" fill="#161d26">Your cards,</text>
  <text x="86" y="358" font-family="'New York', 'Iowan Old Style', Georgia, serif" font-size="71" font-weight="500" letter-spacing="-3" fill="#161d26"><tspan font-style="italic" fill="#2c6659">quietly</tspan> in order.</text>
  <text x="88" y="407" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="16.5" font-weight="400" letter-spacing="-0.05" fill="#3f4a58">Calendar-month spending and current balances for every card —</text>
  <text x="88" y="432" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="16.5" font-weight="400" letter-spacing="-0.05" fill="#3f4a58">kept in one encrypted ledger on this Mac.</text>

  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#3f4a58">
    <rect x="88" y="470" width="192" height="32" rx="16" fill="#fffdf8" stroke="#ddd5c4"/>
    <circle cx="106" cy="486" r="3.5" fill="#2c6659"/>
    <text x="118" y="490">SQLCipher encrypted</text>

    <rect x="292" y="470" width="117" height="32" rx="16" fill="#fffdf8" stroke="#ddd5c4"/>
    <circle cx="310" cy="486" r="3.5" fill="#b26a4c"/>
    <text x="322" y="490">No account</text>

    <rect x="421" y="470" width="137" height="32" rx="16" fill="#fffdf8" stroke="#ddd5c4"/>
    <circle cx="439" cy="486" r="3.5" fill="#b26a4c"/>
    <text x="451" y="490">Demo included</text>
  </g>

  <line x1="88" y1="522" x2="560" y2="522" stroke="#ded5c4" stroke-width="1"/>
  <text x="88" y="542" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.5" letter-spacing="1.4" fill="#8a8172">v0.1.0 · EARLY AND EXPERIMENTAL</text>

  <!-- green cardigan panel -->
  <g filter="url(#w-panelshadow)">
    <path d="M 1044 0 H 1600 V 560 H 1044 Q 1000 560 1000 516 V 44 Q 1000 0 1044 0 Z" fill="url(#w-panel)"/>
  </g>
  <g clip-path="url(#w-panelclip)">
    <circle cx="1140" cy="80" r="240" fill="#ffffff" opacity="0.04"/>
    <g fill="none" stroke="#fffdf8" stroke-width="52" stroke-linecap="round" opacity="0.035">
      <path d="M 1000 160 C 1100 60 1200 260 1300 160 C 1400 60 1500 260 1600 160"/>
      <path d="M 1000 210 C 1100 110 1200 310 1300 210 C 1400 110 1500 310 1600 210"/>
    </g>
    <g stroke="#f7f3e8" stroke-width="1" opacity="0.04">
      <path d="M 1050 0 V 560 M 1100 0 V 560 M 1150 0 V 560 M 1200 0 V 560 M 1250 0 V 560 M 1300 0 V 560 M 1350 0 V 560 M 1400 0 V 560 M 1450 0 V 560 M 1500 0 V 560 M 1550 0 V 560"/>
    </g>

    <!-- garment label -->
    <rect x="1160" y="52" width="280" height="42" rx="6" fill="#f7f3e8" opacity="0.07"/>
    <rect x="1160" y="52" width="280" height="42" rx="6" fill="none" stroke="#f7f3e8" stroke-width="1" stroke-dasharray="3 5" opacity="0.35"/>
    <text x="1300" y="78" text-anchor="middle" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.5" font-weight="500" letter-spacing="3.4" fill="#f7f3e8" opacity="0.7">CARDIGAN_MONEY</text>

    <!-- fanned cards -->
    <g transform="rotate(-18 1250 306)" filter="url(#w-cardshadow)">
      <rect x="1064" y="166" width="322" height="202" rx="19" fill="url(#w-navy)" stroke="#9cb5c8" stroke-opacity="0.28"/>
      <text x="1110" y="215" font-family="'New York', 'Iowan Old Style', Georgia, serif" font-size="24" letter-spacing="-0.8" fill="#f2f4f6">cm<tspan fill="#7fc2b0">.</tspan></text>
      <text x="1372" y="214" text-anchor="end" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.5" letter-spacing="1.2" fill="#b9c3ce">•••• 0606</text>
      <rect x="1112" y="248" width="44" height="33" rx="7" fill="url(#w-chip)" opacity="0.9"/>
      <g fill="none" stroke="#7fc2b0" stroke-width="3" stroke-linecap="round" opacity="0.7">
        <path d="M 1080 330 C 1134 308 1188 352 1242 330 C 1296 308 1350 352 1404 330"/>
        <path d="M 1080 344 C 1134 322 1188 366 1242 344 C 1296 322 1350 366 1404 344" opacity="0.45"/>
      </g>
    </g>

    <g transform="rotate(-2 1260 318)" filter="url(#w-cardshadow)">
      <rect x="1100" y="182" width="318" height="200" rx="19" fill="url(#w-rust)"/>
      <text x="1130" y="227" font-family="'New York', 'Iowan Old Style', Georgia, serif" font-size="24" letter-spacing="-0.8" fill="#fff6ea">cm<tspan fill="#f3d6c1">.</tspan></text>
      <text x="1388" y="226" text-anchor="end" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.5" letter-spacing="1.2" fill="#f6e4d4">•••• 2201</text>
      <rect x="1132" y="260" width="44" height="33" rx="7" fill="#5e3424" opacity="0.6"/>
      <g fill="none" stroke="#fff6ea" stroke-linecap="round" opacity="0.45">
        <path d="M 1116 340 C 1176 314 1236 366 1296 340 C 1356 314 1416 366 1476 340" stroke-width="12"/>
        <path d="M 1116 356 C 1176 330 1236 382 1296 356 C 1356 330 1416 382 1476 356" stroke-width="3" stroke-dasharray="1 16"/>
      </g>
    </g>

    <g transform="rotate(12 1270 324)" filter="url(#w-cardshadow)">
      <rect x="1130" y="196" width="308" height="196" rx="19" fill="url(#w-cream)"/>
      <text x="1160" y="241" font-family="'New York', 'Iowan Old Style', Georgia, serif" font-size="25" letter-spacing="-0.8" fill="#1f4c42">cm<tspan fill="#b26a4c">.</tspan></text>
      <text x="1408" y="240" text-anchor="end" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.5" letter-spacing="1.2" fill="#5f6a78">•••• 4101</text>
      <rect x="1162" y="276" width="44" height="33" rx="7" fill="url(#w-chip)"/>
      <path d="M 1136 344 H 1432" stroke="#245a4e" stroke-width="18" opacity="0.94"/>
      <path d="M 1138 344 H 1430" stroke="#f7f3e8" stroke-width="1.4" stroke-dasharray="2 10" opacity="0.55"/>
      <g stroke="#fffdf8" stroke-width="1.4" stroke-linecap="round" opacity="0.4">
        <path d="M 1160 337 L 1166 351 M 1192 337 L 1198 351 M 1224 337 L 1230 351 M 1256 337 L 1262 351 M 1288 337 L 1294 351 M 1320 337 L 1326 351 M 1352 337 L 1358 351 M 1384 337 L 1390 351 M 1416 337 L 1422 351"/>
      </g>
    </g>

    <!-- knitted pocket band -->
    <g clip-path="url(#w-pocketclip)">
      <path d="M 990 424 Q 1300 468 1610 424 L 1610 570 L 990 570 Z" fill="url(#w-pocket)"/>
      <g stroke="#f7f3e8" stroke-width="12" stroke-linecap="round" opacity="0.11">
        <path d="M 1020 452 V 570 M 1070 458 V 570 M 1120 463 V 570 M 1170 467 V 570 M 1220 469 V 570 M 1270 470 V 570 M 1320 469 V 570 M 1370 467 V 570 M 1420 463 V 570 M 1470 458 V 570 M 1520 452 V 570 M 1570 444 V 570"/>
      </g>
      <path d="M 1000 430 Q 1300 474 1600 430" fill="none" stroke="#082b25" stroke-width="22" opacity="0.45"/>
      <path d="M 996 421 Q 1300 465 1604 421" fill="none" stroke="#f7f3e8" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.6"/>
    </g>

    <!-- button -->
    <g transform="translate(1494 470)">
      <circle r="30" fill="url(#w-rust)"/>
      <circle r="26" fill="none" stroke="#6f3623" stroke-width="1.2" opacity="0.5"/>
      <g fill="#f7f3e8">
        <circle cx="-9" cy="-9" r="4.2"/>
        <circle cx="9" cy="-9" r="4.2"/>
        <circle cx="-9" cy="9" r="4.2"/>
        <circle cx="9" cy="9" r="4.2"/>
      </g>
      <g stroke="#f2e7d5" stroke-width="2.6" stroke-linecap="round">
        <path d="M -9 -9 C -3 -3 3 3 9 9"/>
        <path d="M -9 9 C -3 3 3 -3 9 -9"/>
      </g>
    </g>
  </g>

  <!-- inner hairline for the panel -->
  <path d="M 1044 0 H 1600 V 560 H 1044 Q 1000 560 1000 516 V 44 Q 1000 0 1044 0 Z" fill="none" stroke="#0d2e27" stroke-width="1.5" opacity="0.4"/>
</svg>
