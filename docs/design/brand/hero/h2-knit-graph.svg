    </filter>
    <filter id="kg-chip" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="560" fill="url(#kg-bg)"/>
  <rect width="1600" height="560" fill="url(#kg-glow)"/>

