<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="cardigan_money hero header — Knit Graph">
  <defs>
    <linearGradient id="kg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14171c"/>
      <stop offset="0.6" stop-color="#151a20"/>
      <stop offset="1" stop-color="#11161a"/>
    </linearGradient>
    <radialGradient id="kg-glow" cx="0.7" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#2d6a5b" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#2d6a5b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kg-panel" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#1c2229"/>
      <stop offset="1" stop-color="#171c22"/>
    </linearGradient>
    <linearGradient id="kg-bar" x1="0" y1="0" x2="0" y2="1">
