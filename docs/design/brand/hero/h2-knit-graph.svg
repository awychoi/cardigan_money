    <pattern id="kg-hatch" width="7" height="7" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="7" stroke="#d79b7d" stroke-width="2.2" opacity="0.55"/>
    </pattern>
    <filter id="kg-shadow" x="-30%" y="-30%" width="170%" height="180%">
