<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-label="cardigan_money hero header — Quiet Ledger">
  <defs>
    <linearGradient id="ql-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#faf8f2"/>
      <stop offset="0.55" stop-color="#f7f5ef"/>
      <stop offset="1" stop-color="#f1ecdf"/>
    </linearGradient>
    <linearGradient id="ql-sheet" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#f6f1e5"/>
    </linearGradient>
    <linearGradient id="ql-card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#357768"/>
      <stop offset="0.5" stop-color="#245a4e"/>
      <stop offset="1" stop-color="#123b33"/>
    </linearGradient>
    <radialGradient id="ql-disc" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#ede7d9"/>
      <stop offset="1" stop-color="#ede7d9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ql-chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0bd80"/>
      <stop offset="1" stop-color="#b08347"/>
    </linearGradient>
    <filter id="ql-shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2c261c" flood-opacity="0.18"/>
    </filter>
    <filter id="ql-shadow-soft" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#2c261c" flood-opacity="0.12"/>
    </filter>
    <clipPath id="ql-card-clip">
      <rect x="1104" y="206" width="402" height="252" rx="22" transform="rotate(-9 1305 332)"/>
    </clipPath>
  </defs>

  <rect width="1600" height="560" fill="url(#ql-paper)"/>

  <!-- faint ledger rules behind the still life -->
  <g stroke="#e7e0d2" stroke-width="1" opacity="0.45">
    <path d="M 900 40 H 1600 M 900 84 H 1600 M 900 128 H 1600 M 900 172 H 1600 M 900 216 H 1600 M 900 260 H 1600 M 900 304 H 1600 M 900 348 H 1600 M 900 392 H 1600 M 900 436 H 1600 M 900 480 H 1600 M 900 524 H 1600"/>
  </g>
  <rect x="900" y="0" width="700" height="560" fill="#f7f5ef" opacity="0.55"/>
  <circle cx="1245" cy="300" r="290" fill="url(#ql-disc)"/>

  <!-- brand lockup -->
  <g transform="translate(88 56)">
    <rect width="44" height="44" rx="11" fill="#2c6659"/>
    <text x="22" y="30" text-anchor="middle" font-family="'New York', 'Iowan Old Style', Georgia, serif" font-size="20" font-weight="600" letter-spacing="-1.2" fill="#fffdf8">cm</text>
  </g>
  <text x="146" y="84" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="15" font-weight="500" letter-spacing="0.1" fill="#161d26">cardigan<tspan fill="#2c6659">_</tspan>money</text>
  <line x1="302" y1="59" x2="302" y2="98" stroke="#d9d2c2" stroke-width="1"/>
  <text x="318" y="83" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="9.5" font-weight="500" letter-spacing="1.7" fill="#5f6a78">LOCAL-FIRST FINANCE FOR MACOS</text>

  <!-- hero copy -->
  <text x="88" y="181" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="2.4" fill="#2c6659">A QUIET LEDGER FOR YOUR CARDS</text>
  <text x="86" y="273" font-family="'New York', 'Iowan Old Style', Georgia, serif" font-size="82" font-weight="500" letter-spacing="-3.4" fill="#161d26">Your money,</text>
  <text x="86" y="357" font-family="'New York', 'Iowan Old Style', Georgia, serif" font-size="82" font-weight="500" font-style="italic" letter-spacing="-3.2" fill="#2c6659">kept close.</text>
  <text x="88" y="406" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="16.5" font-weight="400" letter-spacing="-0.05" fill="#3f4a58">Calendar-month spending, current card balances, and one encrypted</text>
  <text x="88" y="431" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="16.5" font-weight="400" letter-spacing="-0.05" fill="#3f4a58">ledger — on your Mac, and nowhere else.</text>

  <g font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10" font-weight="500" fill="#3f4a58">
    <rect x="88" y="470" width="192" height="32" rx="16" fill="#fffdf8" stroke="#ddd5c4"/>
    <circle cx="106" cy="486" r="3.5" fill="#2c6659"/>
    <text x="118" y="490">SQLCipher encrypted</text>

    <rect x="292" y="470" width="117" height="32" rx="16" fill="#fffdf8" stroke="#ddd5c4"/>
    <circle cx="310" cy="486" r="3.5" fill="#b26a4c"/>
    <text x="322" y="490">No account</text>

    <rect x="421" y="470" width="129" height="32" rx="16" fill="#fffdf8" stroke="#ddd5c4"/>
    <circle cx="439" cy="486" r="3.5" fill="#b26a4c"/>
    <text x="451" y="490">No telemetry</text>
  </g>

  <!-- still life: a card behind a ledger sheet -->
  <g transform="rotate(-9 1305 332)" filter="url(#ql-shadow)">
    <rect x="1104" y="206" width="402" height="252" rx="22" fill="url(#ql-card)"/>
    <text x="1484" y="257" text-anchor="end" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10" letter-spacing="1.4" fill="#cfe2da">•••• 4101</text>
    <g fill="none" stroke="#f7f3e8" stroke-linecap="round" opacity="0.22">
      <path d="M 1112 408 C 1170 370 1228 446 1286 408 C 1344 370 1402 446 1460 408 C 1490 388 1510 388 1524 396" stroke-width="16"/>
      <path d="M 1112 428 C 1170 390 1228 466 1286 428 C 1344 390 1402 466 1460 428 C 1490 408 1510 408 1524 416" stroke-width="4" opacity="0.8"/>
    </g>
  </g>

  <g filter="url(#ql-shadow-soft)">
    <rect x="920" y="150" width="380" height="340" rx="15" fill="url(#ql-sheet)"/>
    <rect x="920" y="150" width="380" height="6" rx="3" fill="#2c6659" opacity="0.85"/>
    <circle cx="946" cy="184" r="4" fill="#2c6659"/>
    <text x="958" y="188" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.5" font-weight="600" letter-spacing="1.5" fill="#2c6659">ENCRYPTED LEDGER</text>
    <text x="1276" y="188" text-anchor="end" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.5" letter-spacing="1.1" fill="#8a8172">OCTOBER 2026</text>
    <text x="950" y="228" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.5" font-weight="500" letter-spacing="1.5" fill="#5f6a78">NET SPENDING</text>
    <text x="948" y="275" font-family="'New York', 'Iowan Old Style', Georgia, serif" font-size="46" font-weight="500" letter-spacing="-1.6" fill="#161d26">$420.16</text>
    <text x="1114" y="274" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.5" letter-spacing="1.1" fill="#8a8172">USD</text>
    <line x1="950" y1="298" x2="1276" y2="298" stroke="#e7e0d2"/>

    <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif" font-size="11.5" fill="#3f4a58">
      <circle cx="954" cy="322" r="3.5" fill="#2c6659"/>
      <text x="968" y="326">Dining</text>
      <text x="1278" y="326" text-anchor="end" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#161d26">$127.07</text>

      <circle cx="954" cy="348" r="3.5" fill="#b26a4c"/>
      <text x="968" y="352">Groceries</text>
      <text x="1278" y="352" text-anchor="end" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#161d26">$105.84</text>

      <circle cx="954" cy="374" r="3.5" fill="#5b6c9d"/>
      <text x="968" y="378">Travel</text>
      <text x="1278" y="378" text-anchor="end" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#161d26">$97.90</text>

      <circle cx="954" cy="400" r="3.5" fill="#7a8f5b"/>
      <text x="968" y="404">Other</text>
      <text x="1278" y="404" text-anchor="end" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="10.5" fill="#161d26">$89.35</text>
    </g>

    <line x1="950" y1="418" x2="1276" y2="418" stroke="#e7e0d2"/>
    <rect x="950" y="435" width="128" height="27" rx="13.5" fill="#e9f0ec"/>
    <g transform="translate(960 442)" fill="none" stroke="#2c6659" stroke-width="1.4" stroke-linecap="round">
      <rect x="0.5" y="6" width="8" height="6.5" rx="1.5"/>
      <path d="M 2.5 6 V 4.2 a 2 2 0 0 1 4 0 V 6"/>
    </g>
    <text x="976" y="453" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.5" font-weight="600" letter-spacing="1.2" fill="#1f4c42">LOCAL ONLY</text>
    <text x="1276" y="453" text-anchor="end" font-family="'SF Mono', ui-monospace, Menlo, monospace" font-size="8.5" letter-spacing="0.6" fill="#8a8172">updated today</text>
  </g>

  <!-- cardigan button -->
  <g filter="url(#ql-shadow-soft)">
    <circle cx="1456" cy="444" r="46" fill="#b26a4c"/>
    <circle cx="1456" cy="444" r="41" fill="none" stroke="#8d4c33" stroke-width="1.5" opacity="0.5"/>
    <g fill="#f7f3e8">
      <circle cx="1440" cy="428" r="6.5"/>
      <circle cx="1472" cy="428" r="6.5"/>
      <circle cx="1440" cy="460" r="6.5"/>
      <circle cx="1472" cy="460" r="6.5"/>
    </g>
    <g stroke="#f2e7d5" stroke-width="4" stroke-linecap="round">
      <path d="M 1440 428 C 1450 438 1462 450 1472 460"/>
      <path d="M 1440 460 C 1450 450 1462 438 1472 428"/>
    </g>
  </g>
</svg>
