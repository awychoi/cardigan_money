<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Argyle app icon concept">
  <defs>
    <linearGradient id="ag-bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#26313a"/>
      <stop offset="0.55" stop-color="#161d23"/>
      <stop offset="1" stop-color="#0c1115"/>
    </linearGradient>
    <radialGradient id="ag-glow" cx="0.5" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#7fc2b0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7fc2b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ag-diamond" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2f6d5f"/>
      <stop offset="0.55" stop-color="#23584d"/>
      <stop offset="1" stop-color="#123a33"/>
    </linearGradient>
    <linearGradient id="ag-button" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fffdf6"/>
      <stop offset="1" stop-color="#e7dcc6"/>
    </linearGradient>
    <pattern id="ag-mint" width="150" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="150" stroke="#7fc2b0" stroke-width="7" opacity="0.26"/>
    </pattern>
    <pattern id="ag-rust" width="150" height="150" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <line x1="0" y1="0" x2="0" y2="150" stroke="#d79b7d" stroke-width="6" opacity="0.18"/>
    </pattern>
    <filter id="ag-shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="ag-buttonshadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#08211c" flood-opacity="0.5"/>
    </filter>
    <clipPath id="ag-tile">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>
    <clipPath id="ag-diamondclip">
      <path d="M 512 180 L 830 500 L 512 820 L 194 500 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ag-tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#ag-bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#ag-glow)"/>
    <path d="M 512 120 L 890 500 L 512 880 L 134 500 Z" fill="none" stroke="#f7f3e8" stroke-width="2" opacity="0.05"/>
    <g stroke="#f7f3e8" stroke-width="1.5" opacity="0.04">
      <path d="M 160 130 V 900 M 220 130 V 900 M 280 130 V 900 M 340 130 V 900 M 400 130 V 900 M 460 130 V 900 M 520 130 V 900 M 580 130 V 900 M 640 130 V 900 M 700 130 V 900 M 760 130 V 900 M 820 130 V 900 M 880 130 V 900"/>
    </g>
  </g>

  <g filter="url(#ag-shadow)">
    <path d="M 512 180 L 830 500 L 512 820 L 194 500 Z" fill="url(#ag-diamond)"/>
    <g clip-path="url(#ag-diamondclip)">
      <rect x="160" y="160" width="704" height="704" fill="url(#ag-mint)"/>
      <rect x="160" y="160" width="704" height="704" fill="url(#ag-rust)"/>
      <path d="M 512 242 L 768 500 L 512 758 L 256 500 Z" fill="none" stroke="#f7f3e8" stroke-width="3" stroke-dasharray="2 15" opacity="0.55"/>
    </g>
    <path d="M 512 180 L 830 500 L 512 820 L 194 500 Z" fill="none" stroke="#8fd5c2" stroke-width="4" opacity="0.45"/>
    <g fill="#f7f3e8" opacity="0.6">
      <circle cx="512" cy="206" r="6"/>
      <circle cx="804" cy="500" r="6"/>
      <circle cx="512" cy="794" r="6"/>
      <circle cx="220" cy="500" r="6"/>
    </g>
  </g>

  <g filter="url(#ag-buttonshadow)">
    <circle cx="512" cy="500" r="78" fill="url(#ag-button)"/>
    <circle cx="512" cy="500" r="73" fill="none" stroke="#c7b99f" stroke-width="2" opacity="0.7"/>
    <g fill="#121b20">
      <circle cx="482" cy="470" r="12"/>
      <circle cx="542" cy="470" r="12"/>
      <circle cx="482" cy="530" r="12"/>
      <circle cx="542" cy="530" r="12"/>
    </g>
    <g stroke="#b26a4c" stroke-width="8" stroke-linecap="round">
      <path d="M 482 470 C 494 486 530 514 542 530"/>
      <path d="M 482 530 C 494 514 530 486 542 470"/>
    </g>
  </g>
  <path d="M 546 538 C 570 566 574 592 598 600" fill="none" stroke="#b26a4c" stroke-width="7" stroke-linecap="round" opacity="0.8"/>
  <circle cx="606" cy="602" r="8" fill="#b26a4c"/>

  <rect x="101" y="101" width="822" height="822" rx="183" fill="none" stroke="#070b0e" stroke-width="2" opacity="0.6"/>
  <rect x="112" y="112" width="800" height="800" rx="174" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.07"/>
</svg>
