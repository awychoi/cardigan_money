<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Pocket card app icon concept">
  <defs>
    <linearGradient id="pc-bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#357466"/>
      <stop offset="0.55" stop-color="#245a4e"/>
      <stop offset="1" stop-color="#123a33"/>
    </linearGradient>
    <linearGradient id="pc-card" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#eee6d4"/>
    </linearGradient>
    <linearGradient id="pc-chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d8b372"/>
      <stop offset="1" stop-color="#a97c3f"/>
    </linearGradient>
    <linearGradient id="pc-pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a6759"/>
      <stop offset="1" stop-color="#1b4c42"/>
    </linearGradient>
    <filter id="pc-shadow" x="-30%" y="-30%" width="170%" height="170%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#081f1b" flood-opacity="0.35"/>
    </filter>
    <clipPath id="pc-tile">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>
    <clipPath id="pc-pocketclip">
      <path d="M 138 636 C 300 708 724 708 886 636 L 886 950 L 138 950 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#pc-tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#pc-bg)"/>
    <circle cx="300" cy="260" r="260" fill="#ffffff" opacity="0.05"/>

    <!-- card tucked into the pocket -->
    <g transform="rotate(-7 512 470)" filter="url(#pc-shadow)">
      <rect x="276" y="246" width="472" height="430" rx="34" fill="url(#pc-card)"/>
      <path d="M 276 280 Q 276 246 310 246 L 714 246 Q 748 246 748 280 L 748 314 L 276 314 Z" fill="#b26a4c"/>
      <g fill="#f7f3e8" opacity="0.9">
        <circle cx="660" cy="281" r="7"/>
        <circle cx="686" cy="281" r="7"/>
        <circle cx="712" cy="281" r="7"/>
      </g>
      <rect x="316" y="368" width="76" height="58" rx="12" fill="url(#pc-chip)"/>
      <path d="M 336 368 V 426 M 316 388 H 392 M 316 409 H 392" stroke="#7d5a28" stroke-width="2" opacity="0.55"/>
      <g fill="none" stroke="#2c6659" stroke-width="9" stroke-linecap="round" opacity="0.75">
        <path d="M 652 390 a 28 28 0 0 1 0 40"/>
        <path d="M 670 376 a 52 52 0 0 1 0 68"/>
        <path d="M 688 362 a 76 76 0 0 1 0 96"/>
      </g>
      <path d="M 276 486 H 748 V 552 H 276 Z" fill="#245a4e"/>
      <g fill="none" stroke="#f7f3e8" stroke-width="8" stroke-linecap="round" opacity="0.85">
        <path d="M 302 528 C 330 500 358 500 386 528 C 414 556 442 556 470 528 C 498 500 526 500 554 528 C 582 556 610 556 638 528 C 666 500 694 500 722 528"/>
        <path d="M 302 510 C 330 538 358 538 386 510 C 414 482 442 482 470 510 C 498 538 526 538 554 510 C 582 482 610 482 638 510 C 666 538 694 538 722 510" opacity="0.5"/>
      </g>
      <rect x="316" y="580" width="250" height="14" rx="7" fill="#1b2026" opacity="0.18"/>
      <rect x="316" y="610" width="160" height="14" rx="7" fill="#1b2026" opacity="0.12"/>
    </g>

    <!-- ribbed cardigan pocket -->
    <g clip-path="url(#pc-pocketclip)">
      <path d="M 138 636 C 300 708 724 708 886 636 L 886 950 L 138 950 Z" fill="url(#pc-pocket)"/>
      <g stroke="#f7f3e8" stroke-width="17" stroke-linecap="round" opacity="0.13">
        <path d="M 168 690 V 960 M 224 702 V 960 M 280 710 V 960 M 336 716 V 960 M 392 719 V 960 M 448 721 V 960 M 504 721 V 960 M 560 721 V 960 M 616 719 V 960 M 672 716 V 960 M 728 710 V 960 M 784 702 V 960 M 840 690 V 960"/>
      </g>
      <path d="M 150 648 C 305 716 719 716 874 648" fill="none" stroke="#082b25" stroke-width="26" opacity="0.35"/>
      <path d="M 144 634 C 302 706 722 706 880 634" fill="none" stroke="#f7f3e8" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 22" opacity="0.75"/>
    </g>
  </g>

  <rect x="101" y="101" width="822" height="822" rx="183" fill="none" stroke="#0e332c" stroke-width="2" opacity="0.5"/>
  <rect x="112" y="112" width="800" height="800" rx="174" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.1"/>
</svg>
