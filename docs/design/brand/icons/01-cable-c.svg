    <circle cx="322" cy="286" r="250" fill="#ffffff" opacity="0.4"/>
    <circle cx="810" cy="812" r="300" fill="#b26a4c" opacity="0.035"/>
  </g>

  <rect x="101" y="101" width="822" height="822" rx="183" fill="none" stroke="#ddd5c4" stroke-width="2"/>
