  </g>

  <g mask="url(#cc-band)" stroke="#f7f3e8" stroke-width="9" stroke-linecap="round" opacity="0.7">
    <line x1="500.0" y1="191.0" x2="561.4" y2="258.5"/>
    <line x1="447.0" y1="413.2" x2="454.2" y2="345.4"/>
