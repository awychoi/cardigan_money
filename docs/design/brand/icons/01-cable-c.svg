<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Cable C app icon concept">
  <defs>
    <linearGradient id="cc-bg" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="0.6" stop-color="#f8f5ec"/>
      <stop offset="1" stop-color="#eee8da"/>
    </linearGradient>
    <linearGradient id="cc-yarn" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#347565"/>
      <stop offset="0.55" stop-color="#2c6659"/>
      <stop offset="1" stop-color="#18463c"/>
    </linearGradient>
    <filter id="cc-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#1b2026" flood-opacity="0.18"/>
