<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Woven button coin, Graphite + Poppy">
  <defs>
    <linearGradient id="cw-bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#232d35"/>
      <stop offset="0.62" stop-color="#0d1216"/>
      <stop offset="1" stop-color="#0d1216"/>
    </linearGradient>
    <radialGradient id="cw-glow" cx="0.4" cy="0.25" r="0.7">
      <stop offset="0" stop-color="#e07a66" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e07a66" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cw-shade" cx="0.42" cy="0.34" r="0.7">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.26"/>
    </radialGradient>
    <pattern id="cw-weave" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#8c3d33"/>
      <g fill="#c05a4a">
        <rect x="0" y="7" width="56" height="18" rx="5"/>
        <rect x="0" y="31" width="56" height="18" rx="5"/>
        <rect x="64" y="67" width="56" height="18" rx="5"/>
        <rect x="64" y="91" width="56" height="18" rx="5"/>
      </g>
      <g fill="#e68c78">
        <rect x="70" y="0" width="18" height="56" rx="5"/>
        <rect x="94" y="0" width="18" height="56" rx="5"/>
        <rect x="6" y="64" width="18" height="56" rx="5"/>
        <rect x="30" y="64" width="18" height="56" rx="5"/>
      </g>
    </pattern>
    <filter id="cw-shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="cw-threadshadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="cw-tile">
      <rect x="100" y="100" width="824" height="824" rx="184"/>
    </clipPath>
  </defs>

  <g clip-path="url(#cw-tile)">
    <rect x="100" y="100" width="824" height="824" fill="url(#cw-bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#cw-glow)"/>
    <circle cx="512" cy="512" r="362" fill="none" stroke="#e07a66" stroke-width="2" stroke-dasharray="2 16" opacity="0.3"/>
    <circle cx="512" cy="512" r="392" fill="none" stroke="#e07a66" stroke-width="1" opacity="0.12"/>
  </g>

  <g filter="url(#cw-shadow)">
    <circle cx="512" cy="512" r="324" fill="#54231d"/>
    <circle cx="512" cy="512" r="292" fill="url(#cw-weave)"/>
    <circle cx="512" cy="512" r="292" fill="url(#cw-shade)"/>
    <ellipse cx="430" cy="372" rx="190" ry="105" fill="#ffffff" opacity="0.072"/>

    <circle cx="512" cy="512" r="308" fill="none" stroke="#a34a3d" stroke-width="32"/>
    <circle cx="512" cy="512" r="308" fill="none" stroke="#f6e8d4" stroke-width="32" pathLength="100" stroke-dasharray="2 2" stroke-linecap="butt"/>
    <circle cx="512" cy="512" r="308" fill="none" stroke="#54231d" stroke-width="32" pathLength="100" stroke-dasharray="2 2" stroke-dashoffset="2" stroke-linecap="butt"/>
    <circle cx="512" cy="512" r="324" fill="none" stroke="#54231d" stroke-width="3" opacity="0.8"/>
    <circle cx="512" cy="512" r="292" fill="none" stroke="#54231d" stroke-width="4" opacity="0.55"/>

    <g fill="none" stroke="#f7f3e8" stroke-width="24" stroke-linecap="round" filter="url(#cw-threadshadow)">
      <path d="M 436 436 C 480 478 548 546 588 588"/>
      <path d="M 436 588 C 480 546 548 478 588 436"/>
    </g>
    <path d="M 604 604 C 646 654 666 690 690 704" fill="none" stroke="#f7f3e8" stroke-width="18" stroke-linecap="round" filter="url(#cw-threadshadow)"/>
    <circle cx="699" cy="709" r="10" fill="#f7f3e8"/>

    <g fill="#12171c">
      <circle cx="436" cy="436" r="35"/>
      <circle cx="588" cy="436" r="35"/>
      <circle cx="436" cy="588" r="35"/>
      <circle cx="588" cy="588" r="35"/>
    </g>
    <g fill="none" stroke="#e68c78" stroke-width="3" opacity="0.25">
      <path d="M 410 450 A 30 30 0 0 0 462 450"/>
      <path d="M 562 450 A 30 30 0 0 0 614 450"/>
      <path d="M 410 602 A 30 30 0 0 0 462 602"/>
      <path d="M 562 602 A 30 30 0 0 0 614 602"/>
    </g>
    <circle cx="699" cy="709" r="4" fill="#7fc2b0"/>
  </g>

  <rect x="101" y="101" width="822" height="822" rx="183" fill="none" stroke="#070b0e" stroke-width="2" opacity="0.7"/>
  <rect x="112" y="112" width="800" height="800" rx="174" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.07"/>
</svg>
